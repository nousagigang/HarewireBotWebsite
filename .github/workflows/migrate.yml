name: Migrate Harewire 2024 Website to Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          ref: archive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone legacy repository
        run: |
          git clone --depth 1 https://github.com/nousagigang/harewire.git legacy

      - name: Copy legacy repository into archive/2024
        run: |
          rm -rf archive/2024
          mkdir -p archive/2024

          cp -a legacy/. archive/2024/

          rm -rf archive/2024/.git

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive/2024

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Archive 2024 website from legacy Harewire repository"
            git push origin HEAD:archive
          fi
